---
# Collect the CSI log (csi_per_rb.csv) after a run: OAI gNB/DU, or OCUDU gNB (-e ran=srsRAN, as in the inventory).
# Everything runs on the RAN node; results land on the controller in results/csi-<ran>-<run_id>/ (csi-oai-..., csi-srsran-...).
#
#   ansible-playbook -i inventory/<name>/hosts.ini playbooks/collect_csi.yml
#   ... -e csi_fetch_full=false            # metadata/summary only
- name: Collect CSI log
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    csi_run_id: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    csi_dest_dir: "{{ playbook_dir }}/../results/csi-{{ ran | default('oai') | lower }}-{{ csi_run_id }}"
  tasks:
    - name: Collect csi_per_rb.csv from the gNB (OAI or OCUDU)
      ansible.builtin.include_role:
        name: 5g/csi_logging
        tasks_from: collect.yml
