---
- hosts: all
  gather_facts: true
  tasks:
    - name: Normalize booleans at playbook start
      import_tasks: ../tasks/reload_booleans.yml

# ============================================================
# Set global target_server variable (default: iperf_server_node)
# Can be overridden with: ansible-playbook ... -e "target_server_host=hostname"
# ============================================================
- name: Set target server configuration
  hosts: localhost
  gather_facts: false
  run_once: true
  tasks:
    - name: Determine target server host
      set_fact:
        target_server_host: >-
          {{
            target_server_host
            | default(
                (groups['iperf_server_node'] | default([]) | first),
                true
              )
            | default(groups['core_node'][0])
          }}
        cacheable: yes
      run_once: true
    
    - name: Get target server IP
      set_fact:
        target_server_ip: "{{ hostvars[target_server_host]['ip'] }}"
      run_once: true
    
    - name: Display target server configuration
      debug:
        msg: |
          ✓ Target Server Configuration:
            Host: {{ target_server_host }}
            IP: {{ target_server_ip }}
      run_once: true

- name: Run iperf servers on target server
  hosts: "{{ hostvars['localhost'].get('target_server_host', groups['iperf_server_node'][0]) }}"
  become: true
  vars:
    target_server_host: "{{ hostvars['localhost'].get('target_server_host', groups['iperf_server_node'][0]) }}"
    target_server_ip: "{{ hostvars[target_server_host]['ip'] }}"
    ignore_task_errors: yes
    nb_ues: "{{ 3 if rru == 'rfsim' else (groups['qhats'] + groups['qfits'] + groups['phones']) | length }}"
  roles:
    - role: scenarios/iperf_server

- name: Run RFSIM UE iperf tests (only if rru=rfsim)
  hosts: core_node
  become: true
  gather_facts: false
  vars:
    target_server_host: "{{ hostvars['localhost'].get('target_server_host', groups['iperf_server_node'][0]) }}"
    target_server_ip: "{{ hostvars[target_server_host]['ip'] }}"
    nb_ues: "{{ 3 if rru == 'rfsim' else (groups['qhats'] + groups['qfits'] + groups['phones']) | length }}"
    ignore_task_errors: yes
  tasks:
    - name: Run RFSIM role
      include_role:
        name: scenarios/iperf/rfsim-ue-to-target_server
      when: rru == "rfsim"

- name: Run R2lab UEs to target_server iperf tests from Faraday
  hosts: faraday
  vars:
    target_server_host: "{{ hostvars['localhost'].get('target_server_host', groups['iperf_server_node'][0]) }}"
    ignore_task_errors: yes
    nb_ues: "{{ (groups['qhats'] + groups['qfits'] + groups['phones']) | length }}"
    target_server_ip: "{{ hostvars[target_server_host]['ip'] }}"
  roles:
    - role: scenarios/iperf/ue-to-target_server
      when: rru != "rfsim"

- name: "📊 FINAL SUMMARY (iperf results of this run)"
  hosts: "{{ hostvars['localhost'].get('target_server_host', groups['iperf_server_node'][0]) }}"
  become: true
  gather_facts: false
  tasks:
    # Select the logs of this run by the timestamp registered by scenarios/iperf_server on this host.
    # An mtime window is not reliable: pkill iperf3 at the start of a run appends to the previous logs
    # (refreshing their mtime), and ansible_date_time is the fact gathered at the start of the playbook.
    - name: Find iperf logs of this run
      find:
        paths: "/root/IPERF"
        patterns: "iperf_[0-9]*_{{ iperf_timestamp.stdout }}.log"
      register: iperf_files

    # Port of each UE: 5201 + its index in valid_ue_list (ue-to-target_server, set on faraday)
    - name: Map iperf ports to UEs
      set_fact:
        ue_by_port: "{{ dict(range(5201, 5201 + _ues | length) | map('string') | zip(_ues)) }}"
      vars:
        _ues: "{{ hostvars[groups['faraday'][0]].valid_ue_list | default([]) }}"

    - name: Read logs content
    # One iperf3 server per port logs all the tests of its UE: write one file per test,
    # iperf_<ue>_<ul|dl>_<timestamp>.log. Direction from the server side summary: the server is the
    # receiver for UL and the sender for DL (client -R); a repeated test gets a _2, _3... suffix.
    - name: Split the logs of this run per UE and direction
      shell: |
        python3 - <<'PYEOF'
        import json, os, re, sys
        ts = "{{ iperf_timestamp.stdout }}"
        ue_by_port = json.loads('{{ ue_by_port | to_json }}')
        seen = {}
        for path in {{ iperf_files.files | map(attribute='path') | sort | list | to_json }}:
            port = os.path.basename(path).split("_")[1]
            ue = ue_by_port.get(port, "port" + port)
            text = open(path, errors="replace").read().replace("\x00", "")
            for sec in text.split("Accepted connection")[1:]:
                sec = "Accepted connection" + sec.split("\n-----------------------------------------------------------\nServer listening")[0]
                d = "dl" if re.search(r"\ssender\s*$", sec, re.M) else "ul"
                k = seen[(ue, d)] = seen.get((ue, d), 0) + 1
                out = "/root/IPERF/iperf_%s_%s_%s%s.log" % (ue, d, ts, "" if k == 1 else "_%d" % k)
                open(out, "w").write(sec.rstrip() + "\n")
                print(out)
        for ue in ue_by_port.values():
            for d in ("ul", "dl"):
                if (ue, d) not in seen:
                    print("%s: no %s test reached the iperf server" % (ue, d.upper()), file=sys.stderr)
        PYEOF
      register: iperf_split
      changed_when: iperf_split.stdout_lines | length > 0

    - name: Missing iperf tests
      debug:
        msg: "{{ iperf_split.stderr_lines }}"
      when: iperf_split.stderr_lines | length > 0

    - name: Read the per UE and direction logs
      slurp:
        src: "{{ item }}"
      loop: "{{ iperf_split.stdout_lines }}"
      register: log_contents

    - name: 🚀 DISPLAY LOGS
      debug:
        msg: |
          FILE: {{ item.item }}
          {{ item.content | b64decode }}
      loop: "{{ log_contents.results }}"
      loop_control:
        label: "{{ item.item | basename }}"

    
    - name: "📌 NOTE Location of all iperf results"
      debug:
        msg: "NOTA: All iperfs results are stored in {{ inventory_hostname }} server on /root/IPERF directory"
