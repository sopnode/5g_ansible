---
- name: Render ue-mapper manifest
  ansible.builtin.template:
    src: ue-mapper.yaml.j2
    dest: /tmp/ue-mapper.yaml
    mode: "0644"

- name: Apply ue-mapper manifest
  ansible.builtin.command: kubectl apply -f /tmp/ue-mapper.yaml
  register: ue_mapper_apply
  changed_when: "'created' in ue_mapper_apply.stdout or 'configured' in ue_mapper_apply.stdout"
