---
# rnti-mapper: exports ran_ue_info{rnti,ran_ue_id,imsi,ue_name} 1 so that Grafana panels keyed
# by rnti can show the UE name. IMSI -> name comes from the 'ues' of the 5G profile.
rnti_mapper_namespace: "{{ ran_ns | default(core | default('oai')) }}"
rnti_mapper_image: "docker.io/library/busybox:1.36"
rnti_mapper_port: 9101
rnti_mapper_period: 10
# Static kubectl of the control-plane node, mounted in the pod (avoids pulling a kubectl image)
rnti_mapper_kubectl_path: /usr/bin/kubectl
# RAN side, read from a sidecar sharing the gNB log volume:
#  OAI:   nrRRC_stats.log from metrics-parser (CU UE ID = RAN UE NGAP id, rnti in hex)
#  OCUDU: gNB log from gnb-logs, cu/rrc/ngap at info (set by the srsRAN config role, rnti in decimal)
rnti_mapper_ran_type: "{{ 'ocudu' if (ran | default('oai')) == 'srsRAN' else 'oai' }}"
rnti_mapper_ran_deploy: "{{ 'srsran-gnb' if rnti_mapper_ran_type == 'ocudu' else 'oai-gnb' }}"
rnti_mapper_ran_container: "{{ 'gnb-logs' if rnti_mapper_ran_type == 'ocudu' else 'metrics-parser' }}"
rnti_mapper_ran_file: "{{ '/var/log/gnb.log' if rnti_mapper_ran_type == 'ocudu' else '/oai-gnb-logs/nrRRC_stats.log' }}"
rnti_mapper_ran_pattern: "{{ 'c-rnti=0x|ran_ue=' if rnti_mapper_ran_type == 'ocudu' else '^UE [0-9]+ CU UE ID' }}"
# Core side: OAI AMF "UEs' Information" table, or Open5GS AMF attach lines
rnti_mapper_core_type: "{{ core | default('oai') }}"
rnti_mapper_core_namespace: "{{ core | default('oai') }}"
rnti_mapper_amf_deploy: "{{ 'open5gs-amf' if rnti_mapper_core_type == 'open5gs' else 'oai-amf' }}"
rnti_mapper_amf_container: amf
# OAI prints its UE table periodically (a tail is enough); Open5GS logs the identity only
# at attach time, so the whole log is read (-1)
rnti_mapper_amf_tail: "{{ -1 if rnti_mapper_core_type == 'open5gs' else 3000 }}"
# Exact RAN UE NGAP id <-> IMSI from the slice-awareness N2/PFCP captures (ue-mapper-api),
# used when the latency monitoring is deployed; otherwise the AMF log alone is used
rnti_mapper_inventory_url: >-
  {{ ('http://ue-mapper-api.' ~ (monitoring_namespace | default('monitoring')) ~ '.svc/inventory/ues')
     if (monitoring_components.latency | default(true) | bool) else '' }}
