---
# This role no longer installs anything at deploy time. Collection is done after the run:
#   standalone : ansible-playbook -i <inventory> playbooks/collect_csi.yml
#   experiment : "collect: csi: enabled: true" in the artifact profile (playbooks/run_experiment.yml)
- name: CSI - collect csi_per_rb.csv from the gNB (OAI or OCUDU)
  ansible.builtin.include_tasks: collect.yml
