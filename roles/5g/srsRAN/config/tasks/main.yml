---

- name: Check if ansible venv python exists
  ansible.builtin.stat:
    path: /opt/ansible-venv/bin/python
  register: venv_python

- name: Save current interpreter
  ansible.builtin.set_fact:
    _original_python_interpreter: "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"

- name: Switch to venv python if available
  ansible.builtin.set_fact:
    ansible_python_interpreter: /opt/ansible-venv/bin/python
  when:
    - venv_python.stat.exists
    - core == 'free5gc'
    - core_node_name != ran_node_name

- name: Load common variables
  include_vars:
    file: "../../common/defaults/main.yml"

- name: Ensure kubernetes python client is installed
  ansible.builtin.package:
    name: python3-kubernetes
    state: present
  become: yes
  
- name: Remove existing srsRAN Helm directory to ensure clean state
  ansible.builtin.file:
    path: "{{ repo_dest }}"
    state: absent

- name: Clone repo srsRAN
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_dest }}"
    version: "{{ version | default('main') }}"
    update: no
    force: yes

- name: Ensure namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ ran_ns }}"
    state: present
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Gather env facts (remote)
  ansible.builtin.setup:
    filter: ansible_env
  when: ansible_env is not defined

- name: Normalize repo_dest to remote HOME
  ansible.builtin.set_fact:
    repo_dest_abs: "{{ (repo_dest | default('~/srsran-helm') | trim)
                       | regex_replace('^~/?', ansible_env.HOME ~ '/') }}"

- name: Select values filename from rru
  ansible.builtin.set_fact:
    values_filename: "{{ rru_file_map[(rru | default('rfsim') | string | trim | lower)] | default('values.yaml') }}"
  vars:
    rru_file_map:
      benetel1: values-benetel1.yaml
      benetel2: values-benetel2.yaml
      liteon: values-liteon.yaml
      n300: values-n300-n78-20MHz.yaml # values-n300.yaml is original FDD, band 3
      n320: values-n320-n78-20MHz.yaml # values-n320.yaml is original FDD, band 3
      rfsim: values-rfsim.yaml

- name: Build absolute values_file path
  ansible.builtin.set_fact:
    values_file: "{{ [repo_dest_abs, 'charts', 'srsran-gnb', values_filename] | path_join }}"

- name: debug
  ansible.builtin.debug:
    msg:
      - "repo_dest_abs='{{ repo_dest_abs }}'"
      - "values_file='{{ values_file }}'"

- name: Ensure values file exists (remote)
  ansible.builtin.stat:
    path: "{{ values_file }}"
  register: values_stat

- name: Fail if values file missing
  ansible.builtin.fail:
    msg: "Values file not found: {{ values_file }}"
  when: not values_stat.stat.exists

- name: Patch n3 NAD MTU for free5gc split-node scenario
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: k8s.cni.cncf.io/v1
      kind: NetworkAttachmentDefinition
      metadata:
        name: "{{ n3networkName }}"
        namespace: "{{ ran_ns }}"
      spec:
        config: >-
          { "cniVersion": "0.3.1", "plugins": [ { "type": "ovs",
            "capabilities": { "ips": true }, "bridge": "n3br",
            "mtu": 1450,
            "ipam": { "type": "static", "routes": [ { "dst": "0.0.0.0/0", "gw": "" } ] }
          } ] }
  when:
    - core == 'free5gc'
    - core_node_name != ran_node_name

- name: Apply 5G profile to gNB and UE configs
  include_tasks: apply_5g_profile.yaml

- name: Debug amf ip/port
  debug:
    msg:
      - "amf_ip={{ srsran_network.n2.amf_ip | quote }}"
      - "amf_port={{ srsran_network.n2.amf_port | quote }}"

- name: Update AMF address, gNB N3 IP, namespace and n3networkName
  ansible.builtin.shell: >
    {{ yq_bin_path }} eval -i '
      .gnbConfig.cu_cp.amf.addr = "{{ srsran_network.n2.amf_ip }}" |
      .gnbConfig.cu_cp.amf.port = {{ srsran_network.n2.amf_port }} |
      .gnbConfig.cu_cp.amf.bind_addr = "{{ srsran_network.n2.gnb_bind_ip }}" |
      .gnbConfig.cu_up.ngu.socket = [{"bind_addr": "{{ srsran_network.n3.gnb_ip }}"}] |
      .gnbIp = "{{ srsran_network.n3.gnb_ip }}" |
      .n3networkName = "{{ n3networkName }}" |
      .namespace = "{{ ran_ns }}"
    ' "{{ values_file }}"

# CSI logger of the OCUDU gNB images (ocudu-csi-logging): values csi.* -> CSI_* env + hostPath /data/csi
# of the chart (srsran-helm, branch ocudu). Same switch as for OAI: -e csi_logger_enabled=true.
# srsRAN/OCUDU-only options are prefixed with srsran_.
- name: Configure the CSI logger (csi.* chart values)
  ansible.builtin.shell: >
    {{ yq_bin_path }} eval -i '
      .csi.enabled = {{ csi_logger_enabled | default(false) | bool | lower }} |
      .csi.hostPath = "/data/csi" |
      .csi.granularity = "{{ srsran_csi_granularity | default('rb') }}" |
      .csi.subcarrierSampling = {{ srsran_csi_subcarrier_sampling | default(1) | int }} |
      .csi.flushCore = "{{ srsran_csi_flush_core | default('') }}"
    ' "{{ values_file }}"

# Optional overrides of the values file (srsRAN/OCUDU only):
#   -e srsran_srs_period_ms=<ms>        periodic SRS period, i.e. CSI time resolution (values files: 40)
#   -e srsran_pusch_target_sinr=<dB>    PUSCH closed-loop power control target (values files: 15 for Benetel and USRP)
- name: Check the SRS period and PUSCH target SINR overrides
  ansible.builtin.assert:
    that:
      - srsran_srs_period_ms is not defined or
        (srsran_srs_period_ms | float) in [1, 2, 2.5, 4, 5, 8, 10, 16, 20, 32, 40, 64, 80, 160, 320, 640, 1280, 2560]
      - srsran_pusch_target_sinr is not defined or
        ((srsran_pusch_target_sinr | float) >= -5 and (srsran_pusch_target_sinr | float) <= 30)
    fail_msg: >-
      srsran_srs_period_ms must be an OCUDU SRS period (ms): 1 2 2.5 4 5 8 10 16 20 32 40 64 80 160 320 640 1280 2560;
      srsran_pusch_target_sinr must be in [-5, 30] dB
    quiet: true

- name: Set the SRS period (srsran_srs_period_ms)
  ansible.builtin.shell: >
    {{ yq_bin_path }} eval -i '.gnbConfig.cell_cfg.srs.period_ms = {{ srsran_srs_period_ms }}' "{{ values_file }}"
  when: srsran_srs_period_ms is defined

# OCUDU uses target_sinr only with the PUSCH closed-loop power control (default off; on in the Benetel and USRP values files)
- name: Read the PUSCH closed-loop power control flag of the values file
  ansible.builtin.shell: >
    {{ yq_bin_path }} eval '.gnbConfig.cell_cfg.pusch.enable_cl_loop_pw_control // false' "{{ values_file }}"
  register: srsran_pusch_cl
  changed_when: false
  when: srsran_pusch_target_sinr is defined

- name: Check that srsran_pusch_target_sinr has an effect
  ansible.builtin.assert:
    that: srsran_pusch_cl.stdout | trim | bool
    fail_msg: >-
      srsran_pusch_target_sinr has no effect with {{ values_filename }}: gnbConfig.cell_cfg.pusch.enable_cl_loop_pw_control
      is not true (it is on in the Benetel and USRP n300/n320 values files)
    quiet: true
  when: srsran_pusch_target_sinr is defined

- name: Set the PUSCH target SINR (srsran_pusch_target_sinr)
  ansible.builtin.shell: >
    {{ yq_bin_path }} eval -i '.gnbConfig.cell_cfg.pusch.target_sinr = {{ srsran_pusch_target_sinr }}' "{{ values_file }}"
  when: srsran_pusch_target_sinr is defined

- name: Fix device_args for rfsim GNU Radio single-channel multi-UE
  ansible.builtin.shell: >
    {{ yq_bin_path }} eval -i '
      .gnbConfig.cell_cfg.channel_bandwidth_MHz = 20 |
      .gnbConfig.cell_cfg.pdcch.common.coreset0_index = 12 |
      .gnbConfig.cell_cfg.pdcch.common.ss0_index = 0 |
      .gnbConfig.ru_sdr.srate = 23.04 |
      .gnbConfig.ru_sdr.device_args = "tx_port=tcp://{{ srsran_network.n3.gnb_ip }}:2000,rx_port=tcp://{{ srsran_network.n3.ue_ips[0] }}:2001,base_srate=23.04e6"
    ' "{{ values_file }}"
  when: rru == 'rfsim'

- name: Patch gnb deployment template - parameterize n3network name
  ansible.builtin.replace:
    path: "{{ repo_dest_abs }}/charts/srsran-gnb/templates/deployment.yaml"
    regexp: '"name":\s*"n3network"'
    replace: '"name": "{{ ''{{'' }} .Values.n3networkName {{ ''}}'' }}"'

- name: Patch oai n3 NAD - remove static IPAM address
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: k8s.cni.cncf.io/v1
      kind: NetworkAttachmentDefinition
      metadata:
        name: "{{ n3networkName }}"
        namespace: "{{ ran_ns }}"
      spec:
        config: "{{ {'cniVersion': '0.3.1', 'name': n3networkName, 'type': 'ovs', 'bridge': 'n3br', 'ipam': {'type': 'static'}} | to_json }}"
  when: core == 'oai'
  
# --- rfsim only: UE list + srsue values file ---

- name: Load 5G profile vars
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../group_vars/all/5g_profile_{{ fiveg_profile | default('default') }}.yaml"
    name: fiveg
  when: rru == 'rfsim'

- name: Build full UE list
  set_fact:
    ue_list_full:
      - name: ue1
        index: 1
        imsi: "{{ fiveg.plmn.mcc }}{{ fiveg.plmn.mnc }}{{ fiveg.ues.uesim01.imsi_suffix }}"
        dnn: "{{ fiveg.slices | selectattr('name','equalto',fiveg.ues.uesim01.slice) | map(attribute='dnn') | first }}"
        tx_port: 2101
        rx_port: 2100
        ue_ip: "{{ srsran_network.n3.ue_ips[0] }}"
      - name: ue2
        index: 2
        imsi: "{{ fiveg.plmn.mcc }}{{ fiveg.plmn.mnc }}{{ fiveg.ues.uesim02.imsi_suffix }}"
        dnn: "{{ fiveg.slices | selectattr('name','equalto',fiveg.ues.uesim02.slice) | map(attribute='dnn') | first }}"
        tx_port: 2201
        rx_port: 2200
        ue_ip: "{{ srsran_network.n3.ue_ips[0] }}"
      - name: ue3
        index: 3
        imsi: "{{ fiveg.plmn.mcc }}{{ fiveg.plmn.mnc }}{{ fiveg.ues.uesim03.imsi_suffix }}"
        dnn: "{{ fiveg.slices | selectattr('name','equalto',fiveg.ues.uesim03.slice) | map(attribute='dnn') | first }}"
        tx_port: 2301
        rx_port: 2300
        ue_ip: "{{ srsran_network.n3.ue_ips[0] }}"
  when: rru == 'rfsim'

- name: Slice UE list to ue_count
  set_fact:
    ue_list: "{{ ue_list_full[:ue_count | int] }}"
    ue_indices: "{{ range(1, ue_count | int + 1) | list }}"
  when: rru == 'rfsim'

- name: Write srsue values-rfsim.yaml
  ansible.builtin.copy:
    dest: "{{ [repo_dest_abs, 'charts', 'srsue', 'values-rfsim.yaml'] | path_join }}"
    content: |
      gnbIp: "{{ srsran_network.n3.gnb_ip }}"
      ueIp: "{{ srsran_network.n3.ue_ips[0] }}"
      n3networkName: "{{ n3networkName }}"
      nodeName: "{{ ran_node_name }}"
      nodeSelector:
        kubernetes.io/hostname: "{{ ran_node_name }}"
      ueCount: {{ ue_count }}
      ues:
      {% for ue in ue_list %}
        - imsi: "{{ ue.imsi }}"
          k: "{{ fiveg.security.full_key }}"
          opc: "{{ fiveg.security.opc }}"
          apn: "{{ ue.dnn }}"
          ueIp: "{{ ue.ue_ip }}"
          zmqTxPort: {{ ue.tx_port }}
          zmqRxPort: {{ ue.rx_port }}
      {% endfor %}
  when: rru == 'rfsim'

- name: Restore original python interpreter if it was changed
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ _original_python_interpreter }}"
  when: _original_python_interpreter is defined
