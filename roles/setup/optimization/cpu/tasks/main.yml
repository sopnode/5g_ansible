---
- name: Configure CPU and tuned profile on Ubuntu 22.04
  block:
  
    - name: CPU_CHECK
      ansible.builtin.meta: noop
  
    - name: Install cpupower utility
      package:
        name:
          - linux-tools-common
          - linux-tools-{{ ansible_kernel }}
          - cpufrequtils
        state: present

    - block:
        - name: Install tuned if needed
          ansible.builtin.apt:
            name: tuned
            state: present
            update_cache: yes

        - name: Ensure tuned service is running and enabled
          ansible.builtin.service:
            name: tuned
            state: started
            enabled: true

        - name: Get current tuned profile
          ansible.builtin.command: tuned-adm active
          register: tuned_status
          changed_when: false

        - name: Set tuned profile to throughput-performance
          ansible.builtin.command: tuned-adm profile throughput-performance
          when: "'Current active profile: throughput-performance' not in tuned_status.stdout"
      become: true
      when: inventory_hostname != "sopnode-f3"

    - name: Apply sysctl tuning parameters
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.val }}"
        sysctl_set: yes
        state: present
        reload: yes
      loop:
        - { key: net.core.rmem_default,        val: '134217728' }
        - { key: net.core.rmem_max,            val: '134217728' }
        - { key: net.core.wmem_default,        val: '134217728' }
        - { key: net.core.wmem_max,            val: '134217728' }
        - { key: net.core.netdev_max_backlog,  val: '5000'      }
        - { key: net.core.optmem_max,          val: '524288'    }
        - { key: kernel.sched_rt_runtime_us,   val: '-1'        }
        - { key: kernel.timer_migration,       val: '0'         }

    - name: Create /etc/sysctl.d/rt.conf and apply real-time settings
      block:
        - name: Create /etc/sysctl.d/rt.conf
          ansible.builtin.copy:
            dest: /etc/sysctl.d/rt.conf
            content: |
              kernel.sched_rt_runtime_us=-1
              kernel.timer_migration=0
            owner: root
            group: root
            mode: '0644'

        - name: Apply sysctl settings from /etc/sysctl.d/rt.conf
          ansible.builtin.command: sysctl -p /etc/sysctl.d/rt.conf
          register: sysctl_apply
          changed_when: "'apply' in sysctl_apply.stdout or 'set' in sysctl_apply.stdout"
      when: inventory_hostname == "sopnode-f3"

    - block:
        - name: Check if hyperthreading is disabled (reliable method)
          shell: |
            threads_per_core=$(lscpu | awk '/^Thread\(s\) per core:/ {print $4}')
            if [ "$threads_per_core" -eq 1 ]; then
              echo "Hyperthreading is disabled"
              exit 0
            else
              echo "Hyperthreading is enabled"
              exit 1
            fi
          register: ht_check
          changed_when: false
          failed_when: ht_check.rc != 0

        - name: Show hyperthreading status
          debug:
            msg: "{{ ht_check.stdout }}"
      when: inventory_hostname == "sopnode-f3"

    - block:
        - name: Get CPU idle states
          shell: cpupower idle-info
          register: idle_info
          changed_when: false

        - name: Disable all CPU idle states
          shell: |
            for state in $(cpupower idle-info | awk '/Available idle states/ {for(i=2;i<=NF;i++) print $i}'); do
              cpupower idle-set -d $state || true
            done
          register: disable_idle
          changed_when: "'disabling' in disable_idle.stdout"
          ignore_errors: true

        - name: Show CPU idle states after disabling
          shell: cpupower idle-info
          register: idle_info_after
          changed_when: false

        - name: Display CPU idle states
          debug:
            msg: "{{ idle_info_after.stdout_lines }}"
      when: inventory_hostname == "sopnode-f3"

    # PREEMPT_RT: a SCHED_FIFO busy-poll thread (e.g. the xran fh_rx_bbdev/fh_main_poll threads of
    # the fhi72 gNB, prio 98) can preempt the per-CPU RCU kthread rcuc/N inside an RCU read-side
    # section. With the default RCU priority (rcutree.kthread_prio=1), neither rcuc/N nor its rcub/N
    # boost can run again on that CPU: the grace period never ends and every synchronize_rcu()
    # caller hangs in D state (umount in containerd CreateContainer, runc, iptables, systemd), so
    # the node goes NotReady. Run rcuc/N and rcub/N above the pollers, as rcutree.kthread_prio=99
    # would do at boot (no-op on kernels without these threads).
    - name: Raise the RCU kthreads priority above the RAN busy-poll threads
      ansible.builtin.shell: |
        n=0
        for p in $(pgrep '^rcu[cb]/'); do
          [ "$(chrt -p $p | awk -F': ' '/priority/ {print $2}')" = 99 ] && continue
          chrt -f -p 99 $p && n=$((n+1))
        done
        echo "changed=$n total=$(pgrep -c '^rcu[cb]/')"
      args:
        executable: /bin/bash
      register: rcu_kthread_prio
      changed_when: "'changed=0 ' not in rcu_kthread_prio.stdout"
      become: true

    # sopnode-f3 has no tuned profile (throughput-performance sets the governor on the other nodes):
    # set the performance governor here, for all RAN scenarios (USRP/UHD reports RF late with
    # ondemand/powersave), now and at boot (cpufrequtils)
    - block:
        - name: Set the CPU frequency governor to performance
          ansible.builtin.shell: |
            n=0
            for g in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              [ "$(cat $g)" = performance ] && continue
              echo performance > $g && n=$((n+1))
            done
            echo "changed=$n"
            cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor | sort | uniq -c
          args:
            executable: /bin/bash
          register: cpu_governor
          changed_when: "'changed=0' not in cpu_governor.stdout"

        - name: Keep the performance governor at boot
          ansible.builtin.copy:
            dest: /etc/default/cpufrequtils
            content: |
              GOVERNOR="performance"
            owner: root
            group: root
            mode: "0644"

        - name: Display the CPU frequency governors
          ansible.builtin.debug:
            msg: "{{ cpu_governor.stdout_lines }}"
      become: true
      when: inventory_hostname == "sopnode-f3"
