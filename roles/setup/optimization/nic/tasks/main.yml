---
- name: Install ethtool
  apt:
    name:
      - ethtool
    state: present
    update_cache: yes
  become: true

- name: Disable adaptive-interrupts (Prevent TX Timeouts)
  command: ethtool -C {{ nic_interface }} adaptive-rx off adaptive-tx off
  become: true

- name: Increase NIC ring buffers on {{ nic_interface }}
  command: ethtool -G {{ nic_interface }} tx 8160 rx 8160
  become: true

- name: Install tuned
  apt:
    name:
      - tuned
    state: present
    update_cache: yes
  become: true
  when: inventory_hostname != "sopnode-f3"

- name: Activate throughput-performance tuned profile
  command: tuned-adm profile throughput-performance
  become: true
  when: inventory_hostname != "sopnode-f3"

- name: Show active tuned profile
  command: tuned-adm active
  register: tuned_status
  become: true
  when: inventory_hostname != "sopnode-f3"

- debug:
    msg: "{{ tuned_status.stdout }}"
  when: inventory_hostname != "sopnode-f3"

# IRQ PINNING on RAN node
- name: Apply NIC IRQ pinning only on RAN nodes
  when: inventory_hostname == "sopnode-f3"
  block:
    # Pin the IRQs of the whole E810 card: the 4 PFs (ens15f0np0 management, ens15f1np1 DPDK/SRIOV PF,
    # ens15f2np2 PTP, ens15f3np3) and the ice ctrl/misc vectors. An unpinned PF IRQ on a gNB core is
    # starved by DPDK busy polling: Tx timeout, ice reset blocked in synchronize_irq() holding rtnl,
    # node unreachable. vfio-msix IRQs of the DPDK VFs are not matched.
    # Housekeeping CPUs must match the kernel cmdline of the RT image
    # (irqaffinity=0-5, isolcpus=managed_irq,6-63) and kubelet reservedSystemCPUs.
    # Pinning NIC IRQs on 14-31 put NET_RX softirq on isolated cores that the
    # static CPU manager hands to the gNB pod.
    # One task for all IRQs for more efficiency
    # The pattern also covers ens15f1np1 (DPDK/SRIOV PF).
    - name: Apply IRQ affinity for the E810 card (housekeeping cores)
      ansible.builtin.shell: |
        n=0; failed=""
        for irq in $(grep -E 'ice-|ens15f[0-3]np[0-3]' /proc/interrupts | cut -d: -f1); do
          if { echo {{ ran_housekeeping_cpus | default('0-5') }} > /proc/irq/$irq/smp_affinity_list; } 2>/dev/null; then
            n=$((n+1))
          else
            failed="$failed $irq"
          fi
        done
        echo "pinned $n IRQs on {{ ran_housekeeping_cpus | default('0-5') }}"
        [ -z "$failed" ] || echo "failed IRQs:$failed" >&2
        [ "$n" -gt 0 ]
      args:
        executable: /bin/bash
      register: e810_irq_pin
      changed_when: e810_irq_pin.rc == 0
      become: true

    - name: Make IRQ pinning persistent on reboot
      ansible.builtin.copy:
        dest: /etc/systemd/system/irq-affinity-ens15f0np0.service
        content: |
          [Unit]
          Description=Pin IRQs of the E810 card (all PFs) on housekeeping cores
          After=network-online.target
          [Service]
          Type=oneshot
          # The script recomputes IRQs each time a service starts ($$ = literal $ for systemd)
          ExecStart=/bin/bash -c 'for irq in $$(grep -E "ice-|ens15f[0-3]np[0-3]" /proc/interrupts | cut -d: -f1); do \
            echo {{ ran_housekeeping_cpus | default('0-5') }} > /proc/irq/$$irq/smp_affinity_list; \
          done'
          [Install]
          WantedBy=multi-user.target
      become: true

    - name: Enable IRQ affinity service
      ansible.builtin.systemd:
        daemon_reload: yes
        name: irq-affinity-ens15f0np0.service
        enabled: yes
      become: true